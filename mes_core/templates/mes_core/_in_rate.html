<ol class="in-list">{% for r in rows %}<li><span>{{ r.name }}</span><small class="muted">{{ r.hit }}/{{ r.n }}</small><b class="{% if r.pct is not None and r.pct < 75 %}bad{% elif r.pct is not None and r.pct < 90 %}warn{% endif %}">{% if r.pct is None %}—{% else %}{{ r.pct }} %{% endif %}</b></li>{% empty %}<li class="muted">Ninguna operación debía terminar esta semana.</li>{% endfor %}</ol>
